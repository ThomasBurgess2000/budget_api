[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abacus_api" # You might want to change this
version = "0.1.0"
dependencies = [
    "fastapi",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.0",
    "supabase>=2.15.1",
    "uvicorn[standard]",
]

[project.optional-dependencies]

[tool.hatch.build.targets.wheel]
include = ["main.py"]

[tool.hatch.metadata]
allow-direct-references = true 
